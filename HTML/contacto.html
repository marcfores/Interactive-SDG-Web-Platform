<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - PCM-TelecoODS</title>
    <link rel="stylesheet" href="../CSS/contacto.css">
</head>
<body>
    <header>
        <h1>Contacto</h1>
        <nav class="menu">
            <a href="../index.html">Inicio</a>
            <a href="../HTML/ods.html">ODS</a>
            <a href="../HTML/interactivo.html">Interactivo</a>
            <a href="../HTML/galeria.html">Galería</a>
            <a href="../HTML/estadisticas.html">Estadísticas</a>
            <a href="../HTML/contacto.html">Contacto</a>
        </nav>
    </header>

    <div class="contenedor">
        <h2>Envíanos tus comentarios o preguntas</h2>
        <form action="#" method="post">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
            
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" placeholder="Escribe tu correo electrónico" required>
            
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí" required></textarea>
            
            <button type="submit">Enviar</button>
        </form>
    </div>

    <footer>
        <p>&copy;2024 PCM-TelecoODS</p>
    </footer>

    <script src="../JavaScript/contacto.js"></script>

</body>
</html>
